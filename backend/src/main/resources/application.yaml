spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexo}
    username: ${SPRING_DATASOURCE_USERNAME:nexo}
    password: ${SPRING_DATASOURCE_PASSWORD:nexo}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

nexo:
  timezone: Atlantic/Canary
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 8
  cookie:
    secure: ${COOKIE_SECURE:true}
  admin:
    email: ${NEXO_ADMIN_EMAIL:admin@nexo.local}
    password: ${NEXO_ADMIN_PASSWORD:admin123}
    name: ${NEXO_ADMIN_NAME:Admin}
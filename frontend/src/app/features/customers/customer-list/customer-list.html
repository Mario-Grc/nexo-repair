<div class="page-header">
  <h1>Customers</h1>
  <p-button label="New customer" icon="pi pi-plus" (onClick)="openNew()" />
</div>

<div class="table-scroll">
  <p-table [value]="customers()" [paginator]="true" [rows]="10" emptyMessage="No customers found.">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
      </tr>
    </ng-template>
    <ng-template #body let-customer>
      <tr class="clickable-row" (click)="openDetail(customer)">
        <td>{{ customer.name }}</td>
        <td>{{ customer.email || '-' }}</td>
        <td>{{ customer.phone || '-' }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-customer-form-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [customer]="null"
  (saved)="loadCustomers()"
/>

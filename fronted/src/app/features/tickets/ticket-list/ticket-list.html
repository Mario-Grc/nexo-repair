<div class="page-header">
  <h1>Tickets</h1>
  <p-button label="New ticket" icon="pi pi-plus" (onClick)="openNew()" />
</div>

<p-table [value]="tickets()" [paginator]="true" [rows]="10">
  <ng-template #header>
    <tr>
      <th>Customer</th>
      <th>Device</th>
      <th>Status</th>
      <th>Technician</th>
      <th>Created</th>
    </tr>
  </ng-template>
  <ng-template #body let-ticket>
    <tr (click)="openDetail(ticket)" style="cursor: pointer">
      <td>{{ ticket.customerName }}</td>
      <td>{{ ticket.device.brand }} {{ ticket.device.model }}</td>
      <td><p-tag [value]="getStatusLabel(ticket.status)" [severity]="getStatusSeverity(ticket.status)" /></td>
      <td>{{ ticket.assignedEmployeeName ?? 'Unassigned' }}</td>
      <td>{{ ticket.createdAt | date:'dd/MM/yyyy' }}</td>
    </tr>
  </ng-template>
</p-table>

<p-dialog header="New ticket" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '480px' }">
  <form [formGroup]="form" (ngSubmit)="save()" class="dialog-form">
    <label>
      <span>Customer <span class="required-marker" aria-hidden="true">*</span></span>
      <p-select [options]="customers()" optionLabel="name" optionValue="id" formControlName="customerId" [filter]="true" placeholder="Select a customer" required />
    </label>

    <div formGroupName="device" class="device-group">
      <label>
        <span>Device type <span class="required-marker" aria-hidden="true">*</span></span>
        <p-select [options]="deviceTypeOptions" optionLabel="label" optionValue="value" formControlName="type" required />
      </label>
      <label>Brand<input pInputText formControlName="brand" /></label>
      <label>Model<input pInputText formControlName="model" /></label>
      <label>Serial number / identifier<input pInputText formControlName="identifier" /></label>
    </div>

    <label>
      <span>Problem description <span class="required-marker" aria-hidden="true">*</span></span>
      <textarea pTextarea formControlName="problemDescription" rows="3" required maxlength="500"></textarea>
    </label>

    <p-button type="submit" label="Create ticket" [disabled]="form.invalid" />
  </form>
</p-dialog>

<div class="shell">
  <p-confirmDialog />
  <aside class="sidebar">
    <div class="brand">Nexo</div>
    <nav>
      <a routerLink="/tickets" routerLinkActive="active">Tickets</a>
      <a routerLink="/customers" routerLinkActive="active">Customers</a>
      @if (isAdmin()) {
        <a routerLink="/employees" routerLinkActive="active">Employees</a>
      }
    </nav>
    <div class="current-employee">
      <span class="employee-name">{{ auth.current()?.name }}</span>
      <p-button
        icon="pi pi-key"
        (onClick)="openPasswordDialog()"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        size="small"
        ariaLabel="Change password"
        title="Change password"
      />
      <p-button
        icon="pi pi-sign-out"
        (onClick)="logout()"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        size="small"
        ariaLabel="Log out"
        title="Log out"
      />
    </div>
  </aside>
  <main>
    <router-outlet />
  </main>
</div>

<app-change-password-dialog [visible]="passwordDialogVisible()" (visibleChange)="passwordDialogVisible.set($event)" />
